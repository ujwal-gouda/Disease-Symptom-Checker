<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Disease Prediction System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

    <style>
      body {
        background: #f5f7fa;
      }

      .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .symptom-box {
        height: 350px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="card p-4">
        <h1 class="text-center mb-3">Disease Prediction System</h1>

        <p class="text-center text-muted">
          Select symptoms and predict possible disease
        </p>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label"> Select Symptoms </label>

            <select class="form-select" id="symptoms" name="symptoms" multiple>
              {% for symptom in symptoms %}
                <option value="{{ symptom }}">
                  {{ symptom.replace('_', ' ').title() }}
                </option>
              {% endfor %}
            </select>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Predict Disease
          </button>
        </form>

        {% if prediction %}
          <div class="alert alert-success mt-4 text-center">
            <h4>Prediction Result</h4>
            <strong>{{ prediction }}</strong>
          </div>
        {% endif %}

        
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function() {
    $('#symptoms').select2({
        placeholder: "Search and select symptoms",
        width: '100%'
    });
});
</script>
  </body>
</html>
